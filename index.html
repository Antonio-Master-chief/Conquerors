<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0a07">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CONQUERORS — Forge · Capture · Conquer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1109'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='6' fill='none' stroke='%23a87e2e' stroke-width='1.5'/%3E%3Cg stroke-linecap='round'%3E%3Cline x1='8' y1='24' x2='23' y2='9' stroke='%23c9d2dc' stroke-width='2.6'/%3E%3Cline x1='24' y1='24' x2='9' y2='9' stroke='%23c9d2dc' stroke-width='2.6'/%3E%3Cline x1='6.5' y1='25.5' x2='10' y2='22' stroke='%23e8c45a' stroke-width='3'/%3E%3Cline x1='25.5' y1='25.5' x2='22' y2='22' stroke='%23e8c45a' stroke-width='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1109'/%3E%3Cg stroke-linecap='round'%3E%3Cline x1='8' y1='24' x2='23' y2='9' stroke='%23c9d2dc' stroke-width='2.6'/%3E%3Cline x1='24' y1='24' x2='9' y2='9' stroke='%23c9d2dc' stroke-width='2.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <!-- Game canvas -->
  <canvas id="game"></canvas>

  <!-- HUD (built by ui.js) -->
  <div id="hud" class="hidden">
    <div id="topbar"></div>
    <div id="msglog"></div>
    <div id="bottombar">
      <div id="minimapWrap"><canvas id="minimap" width="176" height="176"></canvas></div>
      <div id="selpanel"></div>
      <div id="actionpanel"></div>
    </div>
  </div>

  <!-- Title screen (built by title.js) -->
  <div id="title"></div>

  <!-- Bulletproof cache-busting: a fresh version token every load means the
       browser can NEVER serve stale game code. document.write executes these
       strictly in order during parse (reliable, unlike dynamic async=false). -->
  <script>
  (function () {
    var V = Date.now();
    var files = ['config', 'save', 'sprites', 'audio', 'path', 'map', 'players',
                 'entities', 'net', 'ai', 'ui', 'input', 'title', 'main'];
    for (var i = 0; i < files.length; i++) {
      document.write('<script src="js/' + files[i] + '.js?v=' + V + '"><\/script>');
    }
  })();
  </script>
</body>
</html>
