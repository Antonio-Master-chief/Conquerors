<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0a07">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CONQUERORS</title>
<script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <!-- Game canvas -->
  <canvas id="game"></canvas>

  <!-- HUD (built by ui.js) -->
  <div id="hud" class="hidden">
    <div id="topbar"></div>
    <div id="msglog"></div>
    <div id="bottombar">
      <div id="minimapWrap"><canvas id="minimap" width="176" height="176"></canvas></div>
      <div id="selpanel"></div>
      <div id="actionpanel"></div>
    </div>
  </div>

  <!-- Title screen (built by title.js) -->
  <div id="title"></div>

  <!-- Bulletproof cache-busting: a fresh version token every load means the
       browser can NEVER serve stale game code. document.write executes these
       strictly in order during parse (reliable, unlike dynamic async=false). -->
  <script>
  (function () {
    var V = Date.now();
    var files = ['config', 'sprites', 'audio', 'path', 'map', 'players',
                 'entities', 'ai', 'ui', 'input', 'title', 'main'];
    for (var i = 0; i < files.length; i++) {
      document.write('<script src="js/' + files[i] + '.js?v=' + V + '"><\/script>');
    }
  })();
  </script>
</body>
</html>
